<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Register</title>

  <link href="static/css/general.css" rel="stylesheet">
</head>

<body>
  <div class="topnav">
    <a href="/">Home</a>
    <a class="active" href="/register">Register</a>
    <a href="/login">Login</a>
  </div>

  <div class="center_in_box">
    <h1>LARKUM DATABASE</h1>

    <h3>Register</h3>
      <form action='register' method='POST'>
        <input type='text' name='email' id='email' placeholder='email'/><br><br>
        <label for="name">Name: </label>
        <select name="name" id="name">
          <option value="guest" selected>Guest</option>
        </select><br><br>
        <input type='password' name='password' id='password' placeholder='password'/><br><br>
        <input type='password' name='password2' id='password2' placeholder='retype password'/><br><br>
        <input type='password' name='lab_password' id='lab_password' placeholder='lab password'/><br><br>
        <label id="msg" class="err">{{msg}}</label><br>
        <input type='submit' name='submit' value="register"/>
      </form>
  </div>
</body>

</html>
