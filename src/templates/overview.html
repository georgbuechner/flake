<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>{{user}}</title>

  <link href="/static/css/general.css" rel="stylesheet">
  <script src="/static/js/general.js"></script>
</head>

<body>
  <div class="center_in_box">
    <h1>Larkum database: <i>{{user}}</i></h1>

    <table class="center">
      <tr>
        <th>ID</th>
        <th>Responsible</th>
        <th>Sex</th>
        <th>Line / Strain (Name)</th>
        <th>DOB</th>
        <th>Sacrifice date</th>
        <th>License number</th>
      </tr>
      {% for entry in animal_data %}
        <tr>
          <td>{{entry.id}}</li>
          <td>{{entry.user}}</li>
          <td>{{entry.sex}}</li>
          <td>{{entry.line}}</li>
          <td>{{entry.dob}}</li>
          <td>{{entry.death_date}}</li>
          <td>{{entry.protocol}}</li>
          <td><a href="/{{user}}/{{entry.protocol_escaped}}">edit</a></td>
      {% endfor %}
    </table>

    <br><br>

    <label>Upload pyrat csv: <label>
    <input type="file" id="pyrat_csv" accept=".csv" /></input>
    <input type="submit" id="submit" value="upload" onclick="UploadPyratData('{{user}}')">

  </div>
</body>

</html>
