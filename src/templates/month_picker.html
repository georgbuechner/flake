<select id="filter_year_{{from_to_range}}" autocomplete="off" class="month_picker_year">
  {% for x in range(10) %}
    {% set year = 2023 - x %}
    {% if year|string in curyear %}
      <option selected>{{year}}</option>
    {% else %}
      <option>{{year}}</option>
    {%- endif -%}
  {% endfor %}
</select>
<select id="filter_month_{{from_to_range}}" autocomplete="off" class="month_picker_month">
  {% set months = {"01":"January", "02":"February", "03":"March", "04":"April", "05":"May", "06":"June", "07":"July", "08":"August", "09":"September", "10":"October", "11":"November", "12":"December"} %}
  <option value=""></option>
  {% for month, month_name in months.items() %}
  {% if month|string in curmonth %}
      <option value={{month}} selected>{{month_name}}</option>
    {% else %}
      <option value={{month}}>{{month_name}}</option>
    {%- endif -%}
  {% endfor %}
</select>
