<form action="{{category}}" method="POST">
  <select 
    type="text" name="name" id="name" placeholder="name" onchange="Set(this)"
  >
    {% for definition in definitions %}
      <option value="{{definition.name}}">{{definition.name}}</option>
    {% endfor %}
  </select>
  <br><br>
  <input type="text" name="amount" id="amount" placeholder="amount">
  <br><br>
  <input type="text" name="concentration" id="concentration" placeholder="concentration">
  <br><br>
  <input 
    type="text" name="days_after_surgery" id="days_after_surgery" placeholder="days_after_surgery"
  >
  <br><br>
  <input type='submit' name='submit'/>
</form>
