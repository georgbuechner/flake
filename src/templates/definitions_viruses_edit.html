<form action="viruses" method="POST">
  <table class="center"> 
    <tr>
      <td><label for="name">Name:</label></td>
      <td><input type="text" name="name" id="name" placeholder="name"></td>
    </tr>

    <tr>
      <td><label for="procedure">Procedure:</label></td>
      <td>
        <select type="text" name="procedure" id="procedure" autocomplete="off">
        {% for procedure in procedures %}
          <option value="{{procedure.name}}">{{procedure.name}}</option>
        {% endfor %}
        </select>
      </td>
    </tr>

    <tr>
      <td><label for="amount">Amount (nl):</label></td>
      <td><input type="text" name="amount" id="amount" placeholder="amount"></td>
    </tr>
  </table>
  <br><br>
  <input type='submit' name='submit'/>
</form>
