<form action="viruses" method="POST">
  <table class="center">

    <tr>
      <td><label for="name">Name:</label></td>
      <td><select id="name" name="name" autocomplete="off" onchange='Set(this, {{json_viruses|safe}})'>
        <option value="---" selected>---</option>
        {% for e in availible_viruses %}
          <option value="{{e.name}}">{{e.name}}</option>
        {% endfor %}
      </select></td>
    </tr>

    <tr>
      <td><label for="procedure">Procedure:</label></td>
      <td>
        <select type="text" name="procedure" id="procedure" autocomplete="off">
        {% for procedure in procedures %}
          <option value="{{procedure.name}}">{{procedure.name}}</option>
        {% endfor %}
      </td>
    </tr>

    <tr>
      <td><label for="amount">Amount:</label></td>
      <td><input type="text" name="amount" id="amount" placeholder="amount"></td>
    </tr>
    
  </table>
  <br><br>
  <input type='submit' name='submit'/>
</form>
